services:
  - type: web
    name: aibilling
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn aibilling.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: "/healthz/"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_SETTINGS_MODULE
        value: "aibilling.settings.production"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: AI_PROVIDER
        value: "gemini"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
