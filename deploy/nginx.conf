# /etc/nginx/sites-available/aibilling
# Nginx reverse proxy configuration for AI Billing (Bill Scanner & Ledger)

server {
    listen 80;
    listen [::]:80;
    server_name billing.example.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name billing.example.com;

    # SSL Certificates (managed by Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/billing.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billing.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Allow bill image & PDF uploads up to 15 MB (set 20M buffer for multipart overhead)
    client_max_body_size 20M;

    # Serve collected static files directly
    location /static/ {
        alias /var/www/aibilling/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Serve uploaded bill files and shop logos
    location /media/ {
        alias /var/www/aibilling/media/;
        expires 7d;
        add_header Cache-Control "private";
    }

    # Proxy application traffic to Gunicorn Unix socket
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_pass http://unix:/run/gunicorn/aibilling.sock;
    }
}
