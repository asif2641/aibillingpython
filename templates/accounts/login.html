<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login — Bill Scanner & Ledger{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        h1 { margin: 0 0 1.5rem; font-size: 1.5rem; color: #1a1a2e; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 500; color: #444; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: #6366f1;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #4f46e5; }
        .errors { background: #fee2e2; color: #b91c1c; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="card">
    <h1>🧾 Bill Scanner & Ledger</h1>
    {% if form.errors %}
        <div class="errors">
            Invalid username or password. Please try again.
        </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="id_username">Username</label>
        {{ form.username }}
        <label for="id_password">Password</label>
        {{ form.password }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Sign In</button>
    </form>
</div>
</body>
</html>
